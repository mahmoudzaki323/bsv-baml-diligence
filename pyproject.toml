[project]
name = "bsv-baml-diligence"
version = "0.1.0"
description = "Hands-on BAML diligence benchmark using Gemini API support ticket triage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "baml-py==0.203.1",
  "google-genai>=1.33.0",
  "matplotlib>=3.9.0",
  "pandas>=2.2.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
bsv-baml = "bsv_baml_diligence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsv_baml_diligence"]
